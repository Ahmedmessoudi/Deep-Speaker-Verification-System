services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speaker-verification-api
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./Models:/app/Models
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_TYPE=ecapa_tdnn
    restart: unless-stopped
    networks:
      - speaker-verification

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: speaker-verification-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - speaker-verification

  postgres:
    image: postgres:15-alpine
    container_name: speaker-verification-db
    environment:
      - POSTGRES_USER=sv_user
      - POSTGRES_PASSWORD=sv_pass
      - POSTGRES_DB=speaker_verification
    volumes:
      - sv_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - speaker-verification

networks:
  speaker-verification:
    driver: bridge

volumes:
  sv_pgdata:
    driver: local
